# Mosquitto MQTT Broker Configuration
# Lab 8 - MQTT with the Raspberry Pi
# Author: Mae Capacite (C21348423)
# Date: 2025-11-14

# Listen on all network interfaces (not just localhost)
listener 1883 0.0.0.0

# Use IPv4 only for simplicity
socket_domain ipv4

# Use MQTT protocol (not MQTT-SN or WebSockets)
protocol mqtt

# Allow anonymous connections (no authentication required)
# WARNING: This is for lab/development purposes only!
# Production systems should use proper authentication
allow_anonymous true
